name: app

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: Build Android APK (debug-signed unless key.properties exists)
        run: flutter build apk --release --dart-define=SHOTR_API_URL=${{ vars.SHOTR_API_URL || 'https://api.shotr.app' }}
      - uses: actions/upload-artifact@v4
        with:
          name: shotr-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
