name: release-android

# Push a tag like v0.1.0 to publish a downloadable APK on GitHub Releases (free beta distribution).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Write config from repository secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart; fi
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload.jks
            printf '%s\nstoreFile=%s\n' "$ANDROID_KEY_PROPERTIES" "$PWD/android/upload.jks" > android/key.properties
          fi
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build APK and AAB
        run: |
          DEFINES="--dart-define=SHOTR_API_URL=${{ vars.SHOTR_API_URL }} --dart-define=RC_ANDROID_KEY=${{ vars.RC_ANDROID_KEY }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}"
          flutter build apk --release $DEFINES
          flutter build appbundle --release $DEFINES
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: shotr-android-release
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
