name: shotr
description: "Take screenshot. Make a shot."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State, navigation, storage
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Capture and reading
  # 1.9.0 needs compileSdk 37, which AGP 9.1 does not support yet. Bump with AGP.
  receive_sharing_intent: 1.8.1
  image_picker: ^1.2.3
  google_mlkit_text_recognition: ^0.17.1
  flutter_image_compress: ^2.5.1
  crypto: ^3.0.7
  flutter_native_ai: ^0.5.3

  # Account, money, network
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  purchases_flutter: ^10.14.0
  http: ^1.6.0
  connectivity_plus: ^7.3.1

  # Output and reminders
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
